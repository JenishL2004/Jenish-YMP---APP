name: Build Yamaha Patrol APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding project debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Environment
        run: |
          java -version
          gradle --version
          pwd
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      - name: Build Yamaha Patrol Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Yamaha Patrol APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamaha-Patrol-APK
          path: app/build/outputs/apk/debug/app-debug.apk

