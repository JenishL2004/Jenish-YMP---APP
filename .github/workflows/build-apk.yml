name: Build Yamaha Patrol APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Verify Android Project Structure
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          gradle --version

      - name: Build Yamaha Patrol Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Yamaha Patrol APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamaha-Patrol-APK
          path: app/build/outputs/apk/debug/app-debug.apk
